<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Under Maintenance</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="maintenance.css">

    <link rel="icon" type="image/png" href="images/logo.png">
</head>



<body>

    <main class="maintenance-page">
        <header class="maintenance-header">
            <a href="#" class="logo">Portfolio</a>

            <a href="index.html" class="back-home">
                <i class='bx bx-home-alt-2'></i>
                Back to Portfolio
            </a>
        </header>


        <section class="maintenance-container">
            <div class="project-info">
                <p class="maintenance-label">
                    <i class='bx bx-wrench'></i>
                    PROJECT UNDER MAINTENANCE
                </p>

                <h1 id="project-name">
                    Loading Project...
                </h1>

                <p class="maintenance-message" id="maintenance-message">
                    Please wait while the project is being updated.
                </p>

            </div>


            <!-- Animation Area -->
            <div class="animation-container" id="animation-container">
            </div>


            <!-- Progress Section -->
            <div class="progress-section" id="progress-section">
                <div class="progress-header">
                    <span>Project Progress</span>
                    <span id="progress-value">0%</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="maintenance-actions">
                <a href="index.html" class="home-btn">
                    <i class='bx bx-arrow-back'></i>
                    Back to Portfolio
                </a>
            </div>

        </section>


        <!-- Footer -->
        <footer class="maintenance-footer">
            <p>Copyright &copy; 2026 by B.M.&trade; | All Rights Reserved</p>
        </footer>
    </main>

    <script src="maintenance.js"></script>

</body>
</html>
