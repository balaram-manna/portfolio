<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Under Maintenance</title>

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background:
                url("images/maintenance-bg.png")
                center center /
                cover
                no-repeat;
            
            animation: maintenanceScene 12s ease-in-out infinite alternate;

            background-color: #061018;
            color: #ffffff;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .maintenance-page {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;

            position: relative;
        }


        /* =========================
           LEFT CONTENT
        ========================= */

        .maintenance-content {
            width: 48%;
            max-width: 650px;
            margin-left: 7%;
            position: relative;
            z-index: 2;
        }


        /* =========================
           LABEL
        ========================= */

        .maintenance-label {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #00eeff;

            font-size: 1.3rem;
            font-weight: 600;

            letter-spacing: 1.5px;

            margin-bottom: 18px;

            text-shadow:
                0 0 10px rgba(0, 238, 255, 0.5);
        }

        .maintenance-label i {
            font-size: 2rem;
        }


        /* =========================
           MAIN HEADING
        ========================= */

        .maintenance-content h1 {
            font-size: clamp(4rem, 5vw, 6rem);

            line-height: 0.95;

            margin-bottom: 20px;

            color: #ffffff;
        }

        .maintenance-content h1 span {
            color: #00eeff;

            text-shadow:
                0 0 10px #00eeff,
                0 0 25px rgba(0, 238, 255, 0.4);
        }


        /* =========================
           PROJECT NAME
        ========================= */

        .maintenance-content h2 {
            font-size: clamp(1.8rem, 2.5vw, 2.8rem);
            line-height: 1.2;
            margin-bottom: 18px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.75);
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .maintenance-content p {
            max-width: 550px;
            font-size: 1.5rem;
            line-height: 1.6;
            color: #d7e3ea;
            margin-bottom: 30px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 25px;

            border: 2px solid #00eeff;
            border-radius: 30px;

            background: rgba(0, 238, 255, 0.08);

            color: #00eeff;

            text-decoration: none;

            font-size: 1.5rem;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .back-btn i {
            font-size: 2rem;
        }

        .back-btn:hover {
            background: #00eeff;

            color: #061018;

            box-shadow:
                0 0 20px #00eeff,
                0 0 40px rgba(0, 238, 255, 0.3);

            transform: translateY(-3px);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .maintenance-content {
                width: 52%;

                margin-left: 4%;

                padding: 30px;
            }

            .maintenance-content h1 {
                font-size: clamp(3.2rem, 6vw, 5rem);
            }

            .maintenance-content h2 {
                font-size: 2rem;
            }

            .maintenance-content p {
                font-size: 1.25rem;
            }

            .maintenance-label {
                font-size: 1.05rem;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: hidden;

                background-position: 62% center;
            }

            .maintenance-page {
                justify-content: center;
                align-items: center;

                padding: 20px;
            }

            .maintenance-content {
                width: 92%;
                max-width: 500px;

                margin: 0;

                padding: 25px 22px;

                text-align: center;

                border-left: none;
                border-top: 2px solid #00eeff;

                border-radius: 0 0 22px 22px;

                background: rgba(5, 12, 22, 0.72);

                backdrop-filter: blur(7px);
                -webkit-backdrop-filter: blur(7px);
            }

            .maintenance-label {
                justify-content: center;

                font-size: 0.9rem;

                letter-spacing: 1px;
            }

            .maintenance-label i {
                font-size: 1.6rem;
            }

            .maintenance-content h1 {
                font-size: clamp(2.8rem, 11vw, 4rem);

                line-height: 0.95;
            }

            .maintenance-content h2 {
                font-size: clamp(1.5rem, 6vw, 2.1rem);
            }

            .maintenance-content p {
                font-size: 1.05rem;

                line-height: 1.5;
            }

            .back-btn {
                font-size: 1.2rem;

                padding: 10px 20px;
            }

        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 400px) {

            .maintenance-page {
                padding: 12px;
            }

            .maintenance-content {
                padding: 20px 15px;
            }

            .maintenance-content h1 {
                font-size: 2.6rem;
            }

            .maintenance-content h2 {
                font-size: 1.35rem;
            }

            .maintenance-content p {
                font-size: 0.95rem;

                margin-bottom: 18px;
            }

            .maintenance-label {
                font-size: 0.75rem;
            }

            .back-btn {
                font-size: 1.05rem;

                padding: 9px 17px;
            }

        }

        @keyframes maintenanceScene {
            0% {
                background-position: 49% 50%;
            }
            100% {
                background-position: 51% 50%;
            }
        }

    </style>

</head>


<body>

    <main class="maintenance-page">


        <!-- =========================
             LEFT CONTENT
        ========================= -->

        <section class="maintenance-content">

            <div class="maintenance-label">

                <i class='bx bx-hard-hat'></i>

                PROJECT UNDER MAINTENANCE

            </div>


            <h1>
                Under<br>
                <span>Maintenance</span>
            </h1>


            <h2 id="project-name">
                Project
            </h2>


            <p>
                This project is currently under development.
                Our team is working on it and it will be available soon.
            </p>


            <a href="index.html" class="back-btn">

                <i class='bx bx-arrow-back'></i>

                Back to Portfolio

            </a>

        </section>


    </main>


    <!-- =========================
         DYNAMIC PROJECT NAME
    ========================= -->

    <script>

        const params =
            new URLSearchParams(window.location.search);

        const projectName =
            params.get("project");

        if (projectName) {

            document.getElementById("project-name")
                .textContent = projectName;

        }

    </script>


</body>

</html>
